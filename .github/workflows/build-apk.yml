name: Build VFR Nav Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & bundle vendor assets
        run: |
          npm install
          npm run prepare:vendor

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Inject native Java engine & Android permissions
        run: |
          mkdir -p android/app/src/main/java/fr/vfr/briefing
          cp -f native-android/app/src/main/java/fr/vfr/briefing/*.java android/app/src/main/java/fr/vfr/briefing/
          python3 - << 'EOF'
          import pathlib

          manifest_path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest_path.read_text(encoding="utf-8")

          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.WAKE_LOCK",
              "android.permission.HIGH_SAMPLING_RATE_SENSORS"
          ]
          for p in perms:
              tag = f'<uses-permission android:name="{p}" />'
              if p not in xml:
                  xml = xml.replace("<application", f"    {tag}\n\n    <application", 1)

          manifest_path.write_text(xml, encoding="utf-8")
          print("Updated AndroidManifest.xml successfully.")
          EOF

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VFR-Nav-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
